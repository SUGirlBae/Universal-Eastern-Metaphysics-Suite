[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "antigravity-iching-deep-research"
version = "2.0.0"
description = "Antigravity I Ching Deep Research Engine & Portable AI Agent Skill"
readme = "README.md"
authors = [{ name = "Antigravity Open Source" }]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "lunar-python>=1.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
iching = "engine.cli:main"
